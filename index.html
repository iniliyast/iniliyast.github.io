*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:
radial-gradient(circle at top,
#181818 0%,
#080808 40%,
#000000 100%);
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:500px;
text-align:center;
}

.brand-logo{
width:320px;
max-width:90%;
margin-bottom:15px;
display:block;
margin-left:auto;
margin-right:auto;
}

.tagline{
color:#8f8f8f;
margin-bottom:35px;
font-size:15px;
letter-spacing:1px;
}

.btn{
display:block;
text-decoration:none;
color:white;
background:rgba(20,20,20,.9);
border:1px solid #2f2f2f;
padding:18px;
margin:14px 0;
border-radius:18px;
transition:.3s;
font-weight:600;
backdrop-filter:blur(8px);
}

.btn:hover{
transform:translateY(-4px) scale(1.02);
border-color:#bdbdbd;
box-shadow:
0 0 20px rgba(255,255,255,.12),
0 0 40px rgba(255,255,255,.05);
}

.footer{
margin-top:30px;
font-size:12px;
color:#666;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.container{
animation:fadeIn 1s ease;
}
