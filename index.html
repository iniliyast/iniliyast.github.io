<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Demure</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:
radial-gradient(circle at top,
rgba(255,255,255,.04),
transparent 40%),
#050505;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.container{
width:90%;
max-width:500px;
text-align:center;
margin:auto;
animation:fadeIn 1s ease;
}
.avatar{
width:90px;
height:90px;
border-radius:50%;
margin-bottom:20px;
border:2px solid rgba(255,255,255,.15);
}

.brand-logo{
width:320px;
max-width:90%;
margin-bottom:5px;
display:block;
margin-left:auto;
margin-right:auto;
}

.tagline{
color:#8f8f8f;
margin-bottom:20px;
font-size:15px;
letter-spacing:1px;
}

.btn{
display:block;
text-decoration:none;
color:white;

background:
rgba(255,255,255,.03);

backdrop-filter:blur(10px);

border:1px solid
rgba(255,255,255,.08);

padding:18px;

margin:14px 0;

border-radius:18px;

font-weight:700;

transition:.3s;
}

.btn:hover{
transform:translateY(-4px) scale(1.02);
border-color:#bdbdbd;
box-shadow:
0 0 20px rgba(255,255,255,.12),
0 0 40px rgba(255,255,255,.05);
}

.footer{
margin-top:30px;
font-size:12px;
color:#666;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.container{
animation:fadeIn 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
